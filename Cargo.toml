[package]
name = "quantris"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["2d", "audio"] }
rand = "0.10"

# Bevy is unplayably slow unoptimized; optimize the engine fully and the game lightly in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
